# O `location` da cláusula 10.7, e o resto do host que o torna testável.
#
# O GATE É POR RECURSO DESDE 2026-08-29, e antes era por credencial. A diferença que
# se lê AQUI: este `location` não exige mais chave de ninguém. Quem decide é o
# endpoint, que resolve o caminho pedido contra o índice de catálogo e responde 200
# para linha pública sem credencial nenhuma, 401 para caminho que nenhuma linha
# reivindica, e o predicado de recurso para a linha privada.
#
# ISSO DEVOLVE O PRODUTO. Enquanto o `location` exigia chave incondicionalmente, o
# visitante anônimo (que é o produto) não desenhava camada de dados nenhuma, e o tile
# público deixava de ser cacheável na borda porque cada pessoa era uma chave de cache.
#
# E TIRA UM ITEM DA LISTA: republicar o acervo privado sob prefixo próprio só era
# necessário porque um `location` decide por PREFIXO. Um índice decide por caminho
# resolvido, então público e privado dividem o mesmo prefixo sem problema.
#
# O QUE ESTE ARQUIVO NÃO PROVA: nada aqui é o nginx de produção. É a sonda com data
# do deploy que decide se lá o tile está fechado, e ela roda à mão no host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A CHAVE, EXTRAÍDA DE `$request_uri` E NÃO DE `$arg_api_key`. Medido em 2026-08-29,
# e é a armadilha central deste arquivo: dentro do `location` do `auth_request` a
# subrequisição tem args PRÓPRIOS, e eles são vazios, então `$arg_api_key` ali é
# string vazia e `$args` também. O que o nginx COPIA da requisição principal para a
# subrequisição é o `unparsed_uri`, ou seja `$request_uri`, com a query inteira. Daí
# este `map`: ele lê a chave do texto da URI original, e o valor resolve igual nos
# dois contextos.
#
# O REGEX É DELIBERADAMENTE FROUXO no que casa e ESTREITO no que entrega: qualquer
# posição na query (`?api_key=` ou `&api_key=`), e só o que vem até o próximo `&`.
# Chave ausente vira string vazia, que o predicado do backend recusa — a direção de
# falha é a fechada.
map $request_uri $ebgeo_chave_api {
    default                          "";
    "~[?&]api_key=(?<capturada>[^&]+)" $capturada;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Corpo grande do 360 (bundle de images.db). Mantido em sintonia com
    # SV360_MAX_UPLOAD_BYTES do backend.
    client_max_body_size 2048m;

    # ---- O app -------------------------------------------------------------
    # Quatro páginas HTML, servidas como arquivo. O `try_files` cai em index.html
    # só para caminho que não resolve; atlas.html, admin.html e calibracao.html
    # resolvem sozinhos.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- A API, inclusive o WebSocket de colaboração ------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- RASTER: o mesmo prefixo, OUTRO servidor atras ---------------------
    # A analise e o basemap sao raster, e o Martin serve vetor. Em producao o prefixo
    # `/tiles/` e um so e atras dele ha mais de um servidor; um gate que soubesse falar
    # apenas com o Martin deixaria a analise inteira de fora. Aqui os tres conjuntos
    # raster (`dem`, `dem-restrito`, `carta-restrita`) sao arquivos, e o mesmo
    # `auth_request` os cobre.
    #
    # A REGEX VEM ANTES do `location /tiles/` de prefixo por ordem do nginx: casamento
    # por expressao regular tem precedencia sobre casamento por prefixo, entao estes
    # tres nao chegam ao proxy do Martin.
    location ~ ^/tiles/(dem|dem-restrito|carta-restrita)/ {
        auth_request /_tile_auth;
        auth_request_set $tile_denial_raster $upstream_http_x_ebgeo_tile_denial;
        add_header X-EBGeo-Tile-Denial $tile_denial_raster always;

        # O REGIME DE CACHE VEM DA MESMA SUBREQUISICAO (D17, 2026-09-15). Ver o bloco
        # do Martin abaixo, onde o porque esta escrito por extenso; aqui o `alias` nao
        # tem upstream, entao nao ha `Cache-Control` de tras para colidir com este.
        auth_request_set $tile_cache_raster $upstream_http_cache_control;
        auth_request_set $tile_vary_raster $upstream_http_vary;
        add_header Cache-Control $tile_cache_raster;
        add_header Vary $tile_vary_raster;

        # Um arquivo so responde por qualquer z/x/y: o conteudo do tile nao e o sujeito
        # desta medicao, o gate e.
        alias /srv/raster/tile.png;
        add_header Content-Type image/png;
    }

    # ---- O PREFIXO DO MARTIN, ATRÁS DA CHAVE -------------------------------
    location /tiles/ {
        auth_request /_tile_auth;

        # O motivo da recusa sai em cabeçalho de resposta do endpoint, nunca em
        # corpo (é uma resposta por TILE). `auth_request_set` é como ele chega até
        # aqui; o `always` faz o cabeçalho sobreviver ao 401, que é o único caso em
        # que ele existe.
        auth_request_set $tile_denial $upstream_http_x_ebgeo_tile_denial;
        add_header X-EBGeo-Tile-Denial $tile_denial always;

        # O REGIME DE CACHE DO TILE NASCE NA SUBREQUISICAO (D17, 2026-09-15), e essa
        # torcao e do desenho: os bytes nao passam pelo Node, entao o unico lugar onde
        # o backend pode dizer "esta resposta dependeu de quem pediu" e o `auth_request`.
        # Com o emprestimo por atlas valendo no tile, a decisao passou a variar por
        # chamador, e um cache compartilhado que guardasse o tile emprestado o entregaria
        # a quem nao tem o emprestimo.
        #
        # SEM `always`, DE PROPOSITO, ao contrario do cabecalho de recusa acima: o regime
        # so vale para a resposta que ENTREGA bytes, e o 401 nao tem bytes a governar.
        #
        # O VALOR VEM VAZIO NO TILE PUBLICO, e o nginx nao acrescenta cabecalho de valor
        # vazio: o caminho publico sai exatamente como saia antes, com o que o Martin lhe
        # der. E por isso que NAO ha `proxy_hide_header Cache-Control` aqui, que apagaria
        # o regime do publico junto.
        #
        # O QUE SOBRA COMO SONDA DO DEPLOY, e fica dito porque nada neste repositorio
        # prova o que o nginx do host faz: se o servidor de tiles de producao emitir
        # `Cache-Control` proprio na linha PRIVADA, os dois cabecalhos coexistem e as
        # diretivas se combinam. `private` continua proibindo a guarda compartilhada, mas
        # o deploy que veja um `public` vindo de tras precisa de `proxy_hide_header
        # Cache-Control` neste `location`. O Martin deste ambiente nao emite nenhum.
        auth_request_set $tile_cache $upstream_http_cache_control;
        auth_request_set $tile_vary $upstream_http_vary;
        add_header Cache-Control $tile_cache;
        add_header Vary $tile_vary;

        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O Martin monta a lista `tiles` do TileJSON a partir do caminho que ele
        # recebeu, e o que ele recebe já perdeu o prefixo `/tiles`. Sem isto o
        # documento anuncia endereços que não existem neste host.
        proxy_set_header X-Rewrite-URL $request_uri;
    }

    # O endpoint de `auth_request`. TRÊS coisas que não se adivinham:
    #
    #  1. A CHAVE VIAJA EM CABEÇALHO, E NÃO NA QUERY, e isto foi MEDIDO, não
    #     escolhido por estilo. A subrequisição do `auth_request` chega ao backend
    #     com a query VAZIA: o log do Express mostra `GET /tile-access?` mesmo
    #     quando a requisição original trazia `?api_key=<uuid>`, e nem escrever
    #     `?api_key=$arg_api_key` nem `?$args` no `proxy_pass` muda isso (as duas
    #     formas foram testadas em 2026-08-29 e as duas recusaram a chave VIVA).
    #     A saída é `x-api-key`, que `flexibleAuth` lê ANTES da query
    #     (`backend/src/middleware/flexible-auth.js`), alimentado pelo `map` do topo
    #     deste arquivo. O tile continua trazendo a chave na query, que é o único
    #     lugar onde o MapLibre a põe; a conversão para cabeçalho acontece aqui, e
    #     só aqui.
    #
    #     SEM ISTO O GATE FALHA FECHADO E PARECE CERTO: todo tile é recusado,
    #     inclusive o de quem porta chave viva, e a recusa é byte a byte igual à
    #     de quem não porta nenhuma. Foi o primeiro resultado da sonda.
    #  2. O CORPO É DESCARTADO. `proxy_pass_request_body off` mais `Content-Length`
    #     vazio: o endpoint responde sem ler nada, e mandar corpo por tile seria
    #     banda paga por nada.
    #  3. O CAMINHO PEDIDO VAI EM CABEÇALHO, E AGORA ELE É LIDO. Era ornamento até
    #     2026-08-29 (o endpoint decidia só sobre a credencial); hoje é o que permite
    #     decidir por RECURSO. `$request_uri` é a URI ORIGINAL, com prefixo e query, e
    #     o backend a recorta usando a MESMA base com que indexa — os dois lados
    #     precisam concordar sobre onde o prefixo termina, e por isso o recorte não é
    #     feito aqui.
    #
    #     SEM ESTE CABEÇALHO O GATE RECUSA TUDO, de propósito: um nginx configurado sem
    #     ele não pode receber "sim" para todo caminho, que seria a falha aberta.
    #  4. O ATLAS EM FOCO VIAJA DENTRO DO MESMO CABEÇALHO, e não num novo (D17,
    #     2026-09-15). A cláusula 6.7 previa "o nginx repassar o atlas em cabeçalho" como
    #     uma das três pontas do conserto, e essa ponta não existiu: `$request_uri` é a URI
    #     original COM a query, então o `?atlasId=` que o cliente carimba na URL do tile já
    #     chegava aqui desde sempre — do mesmo jeito que o `map` do topo tira a chave de API
    #     daquele mesmo texto. Este arquivo não mudou uma linha por causa do empréstimo.
    location = /_tile_auth {
        internal;
        proxy_pass http://backend:8080/api/v1/auth/tile-access;
        proxy_set_header X-API-Key $ebgeo_chave_api;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }
}
