<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibração 360 — EBGeo</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <!-- CSS da página de calibração (manifesto próprio, sem o mapa) -->
    <link rel="stylesheet" href="/src/css/calibracao.css">

    <!-- O CSS do MapLibre 6.x vem do pacote npm, importado por src/js/map/maplibre.js, que é o
         primeiro import do entry desta página. Não há mais cópia em public/vendors/, e com ela
         saiu o par media=print + <noscript>: o Vite emite a folha como asset da página, e sem JS
         esta página não monta mapa nenhum, logo não há estilo a garantir. -->

    <style>
        /* Splash de boot: duplicado do CSS para aparecer antes da folha de estilo resolver
           (mesma abordagem do admin.html). Removido por calibracao-page.js quando a página monta. */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loading-background {
            position: fixed;
            background-color: #508D4E;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
        }
    </style>

    <meta name="theme-color" content="#508D4E">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">
</head>

<body>
    <!-- Splash de boot: o gate de admin decide entre montar a página e redirecionar para o mapa,
         então nada da calibração aparece antes de a sessão ser validada. -->
    <div class="loading-background" id="initial-loader">
        <img src="/images/logo_ebgeo.webp" alt="EBGeo" width="240" fetchpriority="high">
    </div>

    <div class="app-layout">
        <!-- Viewer area -->
        <div id="viewer-container">
            <!-- Three.js canvas and navigation overlay are injected here -->
            <div id="minimap-container"></div>
            <div id="loading-overlay">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- Modo mapa do projeto (sobrepoe o viewer; oculto por padrao) -->
        <div id="project-map" hidden></div>

        <!-- Calibration sidebar -->
        <div id="calibration-panel">
            <div class="cal-panel__empty">
                <p>Carregando...</p>
            </div>
        </div>

        <!-- Project selector (shown when no ?photo= param) -->
        <div id="project-selector"></div>
    </div>

    <!-- Esta página não referencia mais nenhum vendor de public/: o MapLibre 6.x não tem bundle
         UMD e entra pelo npm, no PRIMEIRO import do entry abaixo (src/js/map/maplibre.js), que
         publica `window.maplibregl` antes de `minimap.js` e `project-map.js` instanciarem o
         primeiro mapa. Continua valendo o resto da frase que estava aqui: nada de Turf, milsymbol,
         Cesium ou GDAL nesta página. -->
    <script type="module" src="/src/js/calibration/calibracao-page.js"></script>

    <script nomodule>
        var loader = document.querySelector('.loading-background');
        if (loader) {
            loader.innerHTML = '<div style="color:white;text-align:center;padding:20px;">' +
                '<h2>Browser não suportado</h2>' +
                '<p>Por favor, use um browser mais recente.</p></div>';
        }
    </script>
</body>

</html>
