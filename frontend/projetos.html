<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seus atlas — EBGeo</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <!-- CSS da página de projetos (manifesto próprio, sem o mapa) -->
    <link rel="stylesheet" href="/src/css/projects-page.css">

    <style>
        /* Splash de boot: duplicado do CSS para aparecer antes da folha de estilo resolver
           (mesma abordagem do index.html). Removido por projects-page.js quando a página monta. */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loading-background {
            position: fixed;
            background-color: #508D4E;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
        }
    </style>

    <meta name="theme-color" content="#508D4E">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">
</head>

<body>
    <!-- Splash de boot: a página só aparece depois de ler a configuração do servidor e de tentar
         restaurar a sessão. Sem sessão ela NÃO redireciona: mostra os atlas deste computador e um
         convite para entrar no lugar da lista do servidor. -->
    <div class="loading-background" id="initial-loader">
        <img src="/images/logo_ebgeo.webp" alt="EBGeo" width="240" fetchpriority="high">
    </div>

    <!-- Sem vendors: esta página não carrega MapLibre, Turf, milsymbol, Cesium nem GDAL. -->
    <script type="module" src="/src/js/projects/projects-page.js"></script>

    <script nomodule>
        var loader = document.querySelector('.loading-background');
        if (loader) {
            loader.innerHTML = '<div style="color:white;text-align:center;padding:20px;">' +
                '<h2>Browser não suportado</h2>' +
                '<p>Por favor, use um browser mais recente.</p></div>';
        }
    </script>
</body>

</html>
