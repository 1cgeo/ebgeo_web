<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBGeo</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <!-- Vendors CSS (servidos de public/) -->
    <link rel="stylesheet" href="/vendors/cesium/Widgets/widgets.css" media="print"
        onload="this.media='all'; this.onload=null;">
    <link rel="stylesheet" href="/vendors/maplibre-gl.css" media="print" onload="this.media='all'; this.onload=null;">

    <!-- CSS principal (processado pelo Vite) -->
    <link rel="stylesheet" href="/src/css/style.css">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #map-sig {
            position: relative;
            bottom: 0;
            width: 100%;
            height: 100%;
            cursor: default;
        }

        .loading-background {
            position: fixed;
            background-color: #508D4E;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #map-3d-container {
            display: none;
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #B4E380;
            width: 0%;
            border-radius: 2px;
            animation: progressLoad 2s ease-out forwards;
        }

        @keyframes progressLoad {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        .loading-hidden {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-hidden.loaded {
            opacity: 1;
        }
    </style>

    <!-- META TAGS PARA PERFORMANCE -->
    <meta name="theme-color" content="#508D4E">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">

    <!-- RESOURCE HINTS -->
    <link rel="preload" href="/images/logo_ebgeo.webp" as="image" fetchpriority="high">
    <link rel="prefetch" href="/vendors/cesium/Cesium.js">
    <link rel="prefetch" href="/street_view/build/three.min.js">

</head>

<body>
    <!-- LOADING SCREEN OTIMIZADA -->
    <div class="loading-background" id="initial-loader">
        <div class="loading-content">
            <img src="/images/logo_ebgeo.webp" alt="EBGeo" style="width: 300px; height: auto;" fetchpriority="high">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- CONTENT AREAS -->
    <div id="map-sig" class="loading-hidden" role="application" aria-label="Mapa 2D"></div>

    <!-- 3D CONTAINER - LAZY LOADED -->
    <div id="map-3d-container" style="display: none;" role="application" aria-label="Mapa 3D">
        <div id="map-3d"></div>
        <div id="map-3d-tool-bar" class="card" role="toolbar">

            <div id="tool-3d-container">
                <p><b>Ferramentas</b></p>
                <hr class="solid">
                <div class="tools-3d-bar">
                    <div>
                        <a id="visualizacao" class="button-tool-3d icon-tool-3d" aria-label="Análise de visibilidade">
                            <img src="/images/viewshed_icon.svg" alt="Viewshed" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="distancia" class="button-tool-3d icon-tool-3d" aria-label="Medir distância">
                            <img src="/images/distance_icon.svg" alt="distance" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="area" class="button-tool-3d icon-tool-3d" aria-label="Medir área">
                            <img src="/images/area_icon.svg" alt="area" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="screenshot-3d" class="button-tool-3d icon-tool-3d" title="Salvar tela"
                            aria-label="Salvar tela">
                            <img src="/images/icon_screenshot_black.svg" alt="Screenshot" width="30" height="30"
                                loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="limpar" class="button-tool-3d icon-tool-3d" aria-label="Limpar ferramentas">
                            <img src="/images/clear_icon.svg" alt="clear" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING ACTION BUTTONS -->
    <a id="open-close-form" href="#" class="panel-icon-float" aria-label="Alternar painel de atributos"
        style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
    </a>

    <a id="close-street-view-button" href="#" style="display: none;" aria-label="Fechar street view">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" />
            <path d="M15 9l-6 6M9 9l6 6" />
        </svg>
    </a>
    <a id="close-3d-viewer-button" href="#" style="display: none;" aria-label="Fechar visualização 3D">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" />
            <path d="M15 9l-6 6M9 9l6 6" />
        </svg>
    </a>

    <!-- LAZY LOADED CONTAINERS -->
    <div id="mini-map-street-view" style="display: none;" role="application" aria-label="Mini mapa street view"></div>
    <div id="street-view-container" style="display: none;" role="application" aria-label="Street view"></div>

    <!-- ========================================
         VENDORS EXTERNOS (não bundlear)
         Bibliotecas grandes ou especializadas mantidas como scripts externos
         As demais foram migradas para npm e bundleadas pelo Vite
    ======================================== -->
    <!-- Críticos para inicialização do mapa -->
    <script src="/vendors/maplibre-gl.js"></script>
    <script src="/vendors/turf.min.js"></script>

    <!-- Simbologia militar (defer) -->
    <script src="/vendors/milsymbol.min.js" defer></script>

    <!-- GDAL para export de PDF georreferenciado (defer) -->
    <script src="/vendors/gdal/gdal3.js" defer></script>

    <!-- ========================================
         SCRIPT PRINCIPAL (processado pelo Vite)
    ======================================== -->
    <script type="module" src="/src/js/index.js"></script>


    <!-- FALLBACK PARA BROWSERS ANTIGOS -->
    <script nomodule>
        var loader = document.querySelector('.loading-background');
        if (loader) {
            loader.innerHTML = '<div style="color:white;text-align:center;padding:20px;">' +
                '<h2>Browser não suportado</h2>' +
                '<p>Por favor, use um browser mais recente.</p></div>';
        }
    </script>
</body>

</html>
