<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBGeo</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">

    <!-- PRELOAD CRÍTICO PARA PERFORMANCE -->
    <link rel="stylesheet" href="./vendors/cesium/Widgets/widgets.css" media="print"
        onload="this.media='all'; this.onload=null;">
    <link rel="preload" href="./vendors/maplibre-gl.js" as="script">
    <link rel="preload" href="./css/style.css" as="style">

    <!-- CSS CRÍTICO INLINE (apenas o essencial para above-the-fold) -->
    <style>
        /* Critical CSS - apenas o necessário para carregamento inicial */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #top-bar {
            background-color: #fbfbfa;
            display: flex;
            flex-direction: row;
            width: 100%;
            border-bottom: 0.5mm solid #EEEEEE;
            min-height: 60px;
        }

        #map-sig {
            position: relative;
            bottom: 0;
            width: 100%;
            height: 100%;
            cursor: default;
            margin-top: 42px;
        }

        .loading-background {
            position: fixed;
            background-color: #508D4E;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Hide elementos não críticos durante carregamento */
        #map-3d-container {
            display: none;
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #B4E380;
            width: 0%;
            border-radius: 2px;
            animation: progressLoad 2s ease-out forwards;
        }

        @keyframes progressLoad {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        /* Elementos que aparecem após carregamento inicial */
        .loading-hidden {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-hidden.loaded {
            opacity: 1;
        }
    </style>

    <link rel="stylesheet" href="./vendors/maplibre-gl.css" media="print" onload="this.media='all'; this.onload=null;">
    <link rel="stylesheet" href="./vendors/mapbox-gl-draw.css" media="print"
        onload="this.media='all'; this.onload=null;">
    <link rel="stylesheet" href="./css/style.css" media="print" onload="this.media='all'; this.onload=null;">

    <!-- META TAGS PARA PERFORMANCE -->
    <meta name="theme-color" content="#508D4E">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">

    <!-- RESOURCE HINTS -->
    <link rel="prefetch" href="./vendors/cesium/Cesium.js"> <!-- Carrega quando idle -->
    <link rel="prefetch" href="./street_view/build/three.min.js">

    <!-- PWA/MOBILE OPTIMIZATIONS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EBGeo">
</head>

<body>
    <!-- LOADING SCREEN OTIMIZADA -->
    <div class="loading-background" id="initial-loader">
        <div class="loading-content">
            <img src="./images/logo_ebgeo.png" alt="EBGeo" style="width: 300px; height: auto;">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>


    <!-- TOP BAR EBGEO COMPACTA -->
    <div id="top-bar" class="loading-hidden">
        <!-- Logo Section -->
        <div class="logo-section">
            <img class="logo-img" src="./images/logo_ebgeo.png" alt="EBGeo">
            <h2>
                <span class="logo-eb">EB</span><span class="logo-geo">Geo</span>
                <span class="topbar-subtitle"></span>
            </h2>
        </div>

        <!-- Navigation Buttons Container -->
        <div class="nav-buttons-container">
            <div class="bar-center-buttons">
                <a id="sig-button" class="nav-button icon-button active-button" aria-label="Modo SIG">
                    <img src="./images/icon_sig.svg" alt="SIG" width="25" height="25" loading="eager">
                    <span class="nav-text">SIG</span>
                </a>
                <a id="3d-button" class="nav-button icon-button" aria-label="Modo 3D">
                    <img src="./images/icon_3d.svg" alt="3D" width="25" height="25" loading="lazy">
                    <span class="nav-text">3D</span>
                </a>
            </div>
        </div>

        <!-- Extra Buttons (Tutorial + Mobile Menu) -->
        <div class="extra-bar-buttons">
            <button onclick="window.open('./docs/doc.html', '_blank')" class="tutorial-button"
                aria-label="Abrir tutorial">
                Tutorial
            </button>

            <!-- Mobile Sidebar Toggle -->
            <div>
                <input type="checkbox" class="openSidebarMenu" id="openSidebarMenu" aria-label="Abrir menu mobile">
                <label for="openSidebarMenu" class="sidebarIconToggle" aria-label="Toggle menu">
                    <div class="spinner diagonal part-1"></div>
                    <div class="spinner horizontal"></div>
                    <div class="spinner diagonal part-2"></div>
                </label>
                <div id="sidebarMenu" role="navigation">
                    <div class="sidebar-content">
                        <h3>Menu</h3>
                        <p><a href="./docs/doc.html" target="_blank">Tutorial</a></p>
                        <p><a href="https://geoportal.eb.mil.br/portal/" target="_blank">Portal EB</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENT AREAS -->
    <div id="map-sig" class="loading-hidden" role="application" aria-label="Mapa 2D"></div>

    <!-- 3D CONTAINER - LAZY LOADED -->
    <div id="map-3d-container" style="display: none;" role="application" aria-label="Mapa 3D">
        <div id="map-3d"></div>
        <div id="map-3d-tool-bar" class="card" role="toolbar">
            <div id="model-3d-container">
                <p><b>Modelos 3D</b></p>
                <hr class="solid">
                <div id="locate-3d-container">
                </div>
            </div>
            <div id="tool-3d-container">
                <p><b>Ferramentas</b></p>
                <hr class="solid">
                <div class="tools-3d-bar">
                    <div>
                        <a id="visualizacao" class="button-tool-3d icon-tool-3d" aria-label="Análise de visibilidade">
                            <img src="./images/viewshed_icon.svg" alt="Viewshed" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="distancia" class="button-tool-3d icon-tool-3d" aria-label="Medir distância">
                            <img src="./images/distance_icon.svg" alt="distance" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="area" class="button-tool-3d icon-tool-3d" aria-label="Medir área">
                            <img src="./images/area_icon.svg" alt="area" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="screenshot-3d" class="button-tool-3d icon-tool-3d" title="Salvar tela"
                            aria-label="Salvar tela">
                            <img src="./images/icon_screenshot_black.svg" alt="Screenshot" width="30" height="30"
                                loading="lazy">
                        </a>
                    </div>
                    <div>
                        <a id="limpar" class="button-tool-3d icon-tool-3d" aria-label="Limpar ferramentas">
                            <img src="./images/clear_icon.svg" alt="clear" width="30" height="30" loading="lazy">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING ACTION BUTTONS -->
    <a id="open-close-form" href="#" class="panel-icon-float" aria-label="Alternar painel de atributos"
        style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
    </a>

    <a id="close-street-view-button" href="#" style="display: none;" aria-label="Fechar street view">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" />
            <path d="M15 9l-6 6M9 9l6 6" />
        </svg>
    </a>

    <!-- LAZY LOADED CONTAINERS -->
    <div id="mini-map-street-view" style="display: none;" role="application" aria-label="Mini mapa street view"></div>
    <div id="street-view-container" style="display: none;" role="application" aria-label="Street view"></div>

    <!-- Utilitários essenciais primeiro -->
    <script type="module" src="./js/config.js"></script>
    <script type="module" src="./js/config-loader.js"></script>
    <script src="./vendors/localforage.min.js"></script>
    <script src="./vendors/jquery.min.3.7.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Mapas 2D - crítico para funcionamento inicial -->
    <script src="./vendors/maplibre-gl.js"></script>
    <script src="./vendors/mapbox-gl-draw.js"></script>
    <script src="./vendors/turf.min.js"></script>
    <script src="./vendors/milsymbol.min.js"></script>

    <!-- Bibliotecas de apoio -->
    <script src="./vendors/chart.js" defer></script>
    <script src="./vendors/feather.min.js" defer></script>

    <!-- Bibliotecas para import/export - lazy load -->
    <script src="./vendors/jszip.min.js" defer></script>
    <script src="./vendors/shp.min.js" defer></script>
    <script src="./vendors/togeojson.js" defer></script>
    <script src="./vendors/proj4.min.js" defer></script>
    <script src="./vendors/mgrs.min.js" defer></script>

    <!-- Three.js import map para Street View -->
    <script type="importmap">
    {
        "imports": {
            "three": "/street_view/build/three.module.js",
            "OrbitControls": "/street_view/build/addons/controls/OrbitControls.js",
            "DragControls": "/street_view/build/addons/controls/DragControls.js"
        }
    }
    </script>

    <!-- SCRIPT PRINCIPAL - MODULE -->
    <script type="module" src="./js/index.js"></script>

    <!-- INICIALIZAÇÃO OTIMIZADA -->
    <script>
        // Remove loading screen quando DOM estiver pronto
        document.addEventListener('DOMContentLoaded', function () {
            // Mostra elementos após carregamento inicial
            setTimeout(function () {
                document.querySelectorAll('.loading-hidden').forEach(function (el) {
                    el.classList.add('loaded');
                });

                // Remove loader
                var loader = document.getElementById('initial-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(function () {
                        loader.remove();
                    }, 500);
                }

                // Inicializa ícones
                if (window.feather) {
                    feather.replace();
                }
            }, 50);
        });

    </script>

    <!-- FALLBACK PARA BROWSERS ANTIGOS -->
    <script nomodule>
        document.getElementById('initial-loader').innerHTML =
            '<h2>Browser não suportado</h2><p>Por favor, use um browser mais recente.</p>';
    </script>
</body>

</html>
