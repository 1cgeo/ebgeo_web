<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <!-- Linha principal com gap no centro -->
    <line x1="2" y1="10" x2="8" y2="10" stroke="#ff0000" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="10" x2="18" y2="10" stroke="#ff0000" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Símbolo X no centro -->
    <line x1="8.5" y1="8.5" x2="11.5" y2="11.5" stroke="#ff0000" stroke-width="2" stroke-linecap="round"/>
    <line x1="11.5" y1="8.5" x2="8.5" y2="11.5" stroke="#ff0000" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Texto superior e inferior (representados por pontos) -->
    <circle cx="10" cy="6" r="1" fill="#ff0000"/>
    <circle cx="10" cy="14" r="1" fill="#ff0000"/>
