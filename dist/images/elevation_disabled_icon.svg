<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <g id="elevation-icon-disabled">
    <!-- Mountain peaks - grayed out -->
    <path style="fill:#CCCCCC;stroke:none" 
          d="M 2,12 L 5,6 L 8,9 L 11,4 L 14,8 L 16,6 L 16,14 L 2,14 Z" 
          id="mountains" />
    <!-- Mountain outline - grayed out -->
    <path style="fill:none;stroke:#CCCCCC;stroke-width:0.5px;stroke-linecap:round;stroke-linejoin:round" 
          d="M 2,12 L 5,6 L 8,9 L 11,4 L 14,8" 
          id="mountain-outline" />
    <!-- Disabled X overlay -->
    <g id="disabled-x">
      <path style="stroke:#FF0000;stroke-width:1.5px;stroke-linecap:round" 
            d="M 4,4 L 12,12" />
      <path style="stroke:#FF0000;stroke-width:1.5px;stroke-linecap:round" 
            d="M 12,4 L 4,12" />
    </g>
  </g>
</svg>